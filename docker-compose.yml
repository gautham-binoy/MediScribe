version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mediscribe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediscribe
      POSTGRES_USER: mediscribe
      POSTGRES_PASSWORD: mediscribe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediscribe -d mediscribe"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediscribe_backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://mediscribe:mediscribe@postgres:5432/mediscribe
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      DEMO_MODE: "true"
      AI_PROVIDER: mock
      RAG_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediscribe_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
